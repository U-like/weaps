name: MaleCNS curated runtime build

on:
  workflow_dispatch:
  push:
    branches: [malecns-connectome]
    paths:
      - 'malecns-connectome/scripts/build_runtime_graph.py'
      - '.github/workflows/malecns-runtime-build.yml'

concurrency:
  group: malecns-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT: malecns-connectome
  DATA_BASE: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome
  ANNOTATIONS: body-annotations-male-cns-v1.0-minconf-0.5.feather
  NEUROTRANSMITTERS: body-neurotransmitters-male-cns-v1.0.feather
  WEIGHTS: connectome-weights-male-cns-v1.0-minconf-0.5.feather

jobs:
  build-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: malecns-connectome

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: malecns-connectome/pyproject.toml

      - name: Install project
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'

      - name: Unit tests
        working-directory: ${{ env.PROJECT }}
        run: pytest -q

      - name: Download official MaleCNS flat files
        working-directory: ${{ env.PROJECT }}
        run: |
          mkdir -p data/raw runtime results
          curl -L --fail --retry 3 --retry-delay 5 \
            "$DATA_BASE/$ANNOTATIONS" -o "data/raw/$ANNOTATIONS"
          curl -L --fail --retry 3 --retry-delay 5 \
            "$DATA_BASE/$NEUROTRANSMITTERS" -o "data/raw/$NEUROTRANSMITTERS"
          curl -L --fail --retry 3 --retry-delay 5 \
            "$DATA_BASE/$WEIGHTS" -o "data/raw/$WEIGHTS"
          sha256sum data/raw/*.feather | tee results/runtime_sources.sha256
          ls -lh data/raw/*.feather

      - name: Build curated neuron runtime graph
        working-directory: ${{ env.PROJECT }}
        run: |
          python scripts/build_runtime_graph.py \
            "data/raw/$ANNOTATIONS" \
            "data/raw/$WEIGHTS" \
            --neurotransmitters "data/raw/$NEUROTRANSMITTERS" \
            --nodes runtime/neurons.feather \
            --edges runtime/edges.feather \
            --metadata runtime/metadata.json
          cat runtime/metadata.json
          ls -lh runtime/

      - name: Validate runtime files
        working-directory: ${{ env.PROJECT }}
        run: |
          python - <<'PY'
          import json
          import pyarrow as pa
          import pyarrow.feather as feather
          import pyarrow.ipc as ipc

          nodes = feather.read_table('runtime/neurons.feather')
          assert nodes.num_rows == 166700, nodes.num_rows
          assert len(set(nodes['body_id'].to_pylist())) == nodes.num_rows
          assert nodes['dense_id'][0].as_py() == 0
          assert nodes['dense_id'][-1].as_py() == nodes.num_rows - 1

          with pa.memory_map('runtime/edges.feather', 'r') as src:
              reader = ipc.open_file(src)
              edge_rows = sum(reader.get_batch(i).num_rows for i in range(reader.num_record_batches))
          meta = json.load(open('runtime/metadata.json'))
          assert edge_rows == meta['edges']['edge_count']
          assert edge_rows > 0
          print({'nodes': nodes.num_rows, 'edges': edge_rows})
          PY

      - name: Commit compact runtime metadata checkpoint
        run: |
          cp malecns-connectome/runtime/metadata.json malecns-connectome/results/runtime_metadata.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add malecns-connectome/results/runtime_metadata.json malecns-connectome/results/runtime_sources.sha256
          if git diff --cached --quiet; then
            echo 'No runtime metadata changes.'
          else
            git commit -m 'results: refresh curated MaleCNS runtime metadata [skip ci]'
            git push origin HEAD:malecns-connectome
          fi

      - name: Upload curated runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: malecns-runtime-${{ github.sha }}
          compression-level: 6
          retention-days: 30
          path: |
            malecns-connectome/runtime/neurons.feather
            malecns-connectome/runtime/edges.feather
            malecns-connectome/runtime/metadata.json
            malecns-connectome/results/runtime_sources.sha256
