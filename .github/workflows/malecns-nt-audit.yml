name: MaleCNS neurotransmitter audit

on:
  workflow_dispatch:
  push:
    branches: [malecns-connectome]
    paths:
      - 'malecns-connectome/scripts/audit_neurotransmitters.py'
      - '.github/workflows/malecns-nt-audit.yml'

concurrency:
  group: malecns-nt-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT: malecns-connectome
  DATA_BASE: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome
  ANNOTATIONS: body-annotations-male-cns-v1.0-minconf-0.5.feather
  NEUROTRANSMITTERS: body-neurotransmitters-male-cns-v1.0.feather

jobs:
  nt-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: malecns-connectome

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: malecns-connectome/pyproject.toml

      - name: Install project
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'

      - name: Download official annotations and neurotransmitters
        working-directory: ${{ env.PROJECT }}
        run: |
          mkdir -p data/raw results
          curl -L --fail --retry 3 --retry-delay 5 \
            "$DATA_BASE/$ANNOTATIONS" -o "data/raw/$ANNOTATIONS"
          curl -L --fail --retry 3 --retry-delay 5 \
            "$DATA_BASE/$NEUROTRANSMITTERS" -o "data/raw/$NEUROTRANSMITTERS"
          sha256sum data/raw/*.feather | tee results/nt_sources.sha256

      - name: Audit neurotransmitter coverage and agreement
        working-directory: ${{ env.PROJECT }}
        run: |
          python scripts/audit_neurotransmitters.py \
            "data/raw/$ANNOTATIONS" \
            "data/raw/$NEUROTRANSMITTERS" \
            --output results/neurotransmitter_audit.json
          cat results/neurotransmitter_audit.json

      - name: Commit compact NT audit checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            malecns-connectome/results/neurotransmitter_audit.json \
            malecns-connectome/results/nt_sources.sha256
          if git diff --cached --quiet; then
            echo 'No neurotransmitter audit changes.'
          else
            git commit -m 'results: refresh MaleCNS neurotransmitter audit [skip ci]'
            git push origin HEAD:malecns-connectome
          fi

      - name: Upload NT audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malecns-nt-audit-${{ github.sha }}
          retention-days: 30
          path: |
            malecns-connectome/results/neurotransmitter_audit.json
            malecns-connectome/results/nt_sources.sha256
