name: MaleCNS simulation I/O audit

on:
  workflow_dispatch:
  push:
    branches: [malecns-connectome]
    paths:
      - 'malecns-connectome/src/malecns/io_manifest.py'
      - 'malecns-connectome/src/malecns/body_adapter.py'
      - 'malecns-connectome/src/malecns/runtime.py'
      - 'malecns-connectome/scripts/audit_annotation_io.py'
      - 'malecns-connectome/scripts/audit_runtime_nodes.py'
      - 'malecns-connectome/scripts/audit_head_sensory.py'
      - 'malecns-connectome/scripts/build_io_manifest.py'
      - 'malecns-connectome/scripts/summarize_io_masks.py'
      - 'malecns-connectome/scripts/resolve_physical_ports.py'
      - 'malecns-connectome/config/io_port_rules.json'
      - 'malecns-connectome/config/physical_channel_map.json'
      - 'malecns-connectome/tests/test_runtime_interface.py'
      - '.github/workflows/malecns-io-audit.yml'

concurrency:
  group: malecns-io-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT: malecns-connectome
  DATA_BASE: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome
  ANNOTATIONS: body-annotations-male-cns-v1.0-minconf-0.5.feather

jobs:
  annotation-io-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: malecns-connectome

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: malecns-connectome/pyproject.toml

      - name: Install project
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'

      - name: Unit tests
        working-directory: ${{ env.PROJECT }}
        run: pytest -q

      - name: Download official Janelia annotations
        working-directory: ${{ env.PROJECT }}
        run: |
          mkdir -p data/raw results/io_candidate results/io_resolved
          curl -L --fail --retry 3 --retry-delay 5 \
            "$DATA_BASE/$ANNOTATIONS" -o "data/raw/$ANNOTATIONS"
          sha256sum "data/raw/$ANNOTATIONS" | tee results/annotations.sha256

      - name: Audit annotation schema and runtime node policies
        working-directory: ${{ env.PROJECT }}
        run: |
          python scripts/audit_annotation_io.py \
            "data/raw/$ANNOTATIONS" \
            --output results/annotation_io_audit.json \
            --summary-output results/annotation_io_summary.json
          python scripts/audit_runtime_nodes.py \
            "data/raw/$ANNOTATIONS" \
            --output results/runtime_node_audit.json
          python scripts/audit_head_sensory.py \
            "data/raw/$ANNOTATIONS" \
            --output results/head_sensory_audit.json
          echo '=== HEAD / OPTIC SENSORY AUDIT ==='
          cat results/head_sensory_audit.json

      - name: Build candidate simulation I/O masks and manifest
        working-directory: ${{ env.PROJECT }}
        run: |
          python scripts/build_io_manifest.py \
            "data/raw/$ANNOTATIONS" \
            --rules config/io_port_rules.json \
            --manifest results/io_candidate/io_manifest.candidate.json \
            --sensory-feather results/io_candidate/sensory_inputs.candidate.feather \
            --motor-feather results/io_candidate/motor_outputs.candidate.feather \
            --diagnostic-feather results/io_candidate/diagnostic_ports.candidate.feather \
            --unknowns results/io_candidate/io_unknowns.json \
            --summary results/io_candidate/io_manifest_summary.json
          python scripts/summarize_io_masks.py \
            --sensory results/io_candidate/sensory_inputs.candidate.feather \
            --motor results/io_candidate/motor_outputs.candidate.feather \
            --diagnostic results/io_candidate/diagnostic_ports.candidate.feather \
            --output results/io_candidate/io_physical_summary.json \
            --core-output results/io_candidate/io_physical_core.json
          echo '=== CANDIDATE MANIFEST SUMMARY ==='
          cat results/io_candidate/io_manifest_summary.json
          echo '=== PHYSICAL I/O CORE ==='
          cat results/io_candidate/io_physical_core.json

      - name: Resolve conservative physical body channels
        working-directory: ${{ env.PROJECT }}
        run: |
          python scripts/resolve_physical_ports.py \
            --sensory results/io_candidate/sensory_inputs.candidate.feather \
            --motor results/io_candidate/motor_outputs.candidate.feather \
            --diagnostic results/io_candidate/diagnostic_ports.candidate.feather \
            --map config/physical_channel_map.json \
            --manifest results/io_resolved/io_manifest.physical-candidate.json \
            --resolved-sensory results/io_resolved/sensory_inputs.physical-candidate.feather \
            --resolved-motor results/io_resolved/motor_outputs.physical-candidate.feather \
            --unresolved results/io_resolved/io_unresolved.json \
            --summary results/io_resolved/io_physical_resolution_summary.json
          echo '=== PHYSICAL CHANNEL RESOLUTION ==='
          cat results/io_resolved/io_physical_resolution_summary.json

      - name: Commit reproducible I/O checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            malecns-connectome/results/annotation_io_audit.json \
            malecns-connectome/results/annotation_io_summary.json \
            malecns-connectome/results/runtime_node_audit.json \
            malecns-connectome/results/head_sensory_audit.json \
            malecns-connectome/results/annotations.sha256 \
            malecns-connectome/results/io_candidate/ \
            malecns-connectome/results/io_resolved/
          if git diff --cached --quiet; then
            echo 'No I/O checkpoint changes.'
          else
            git commit -m 'results: refresh MaleCNS head and body I/O audit [skip ci]'
            git push origin HEAD:malecns-connectome
          fi

      - name: Upload I/O checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malecns-io-physical-${{ github.sha }}
          retention-days: 30
          path: |
            malecns-connectome/results/annotation_io_audit.json
            malecns-connectome/results/annotation_io_summary.json
            malecns-connectome/results/runtime_node_audit.json
            malecns-connectome/results/head_sensory_audit.json
            malecns-connectome/results/annotations.sha256
            malecns-connectome/results/io_candidate/
            malecns-connectome/results/io_resolved/
