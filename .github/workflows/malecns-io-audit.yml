name: MaleCNS simulation I/O audit

on:
  workflow_dispatch:
  push:
    branches: [malecns-connectome]
    paths:
      - 'malecns-connectome/src/malecns/io_manifest.py'
      - 'malecns-connectome/src/malecns/body_adapter.py'
      - 'malecns-connectome/src/malecns/runtime.py'
      - 'malecns-connectome/scripts/audit_annotation_io.py'
      - 'malecns-connectome/scripts/build_io_manifest.py'
      - 'malecns-connectome/config/io_port_rules.json'
      - 'malecns-connectome/tests/test_runtime_interface.py'
      - '.github/workflows/malecns-io-audit.yml'

concurrency:
  group: malecns-io-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT: malecns-connectome
  DATA_BASE: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome
  ANNOTATIONS: body-annotations-male-cns-v1.0-minconf-0.5.feather

jobs:
  annotation-io-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: malecns-connectome

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: malecns-connectome/pyproject.toml

      - name: Install project
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'

      - name: Unit tests
        working-directory: ${{ env.PROJECT }}
        run: pytest -q

      - name: Download official Janelia annotations
        working-directory: ${{ env.PROJECT }}
        run: |
          mkdir -p data/raw results
          curl -L --fail --retry 3 --retry-delay 5 \
            "$DATA_BASE/$ANNOTATIONS" -o "data/raw/$ANNOTATIONS"
          sha256sum "data/raw/$ANNOTATIONS" | tee results/annotations.sha256

      - name: Audit annotation schema and I/O superclasses
        working-directory: ${{ env.PROJECT }}
        run: |
          python scripts/audit_annotation_io.py \
            "data/raw/$ANNOTATIONS" \
            --output results/annotation_io_audit.json
          echo '=== I/O AUDIT ==='
          cat results/annotation_io_audit.json

      - name: Commit compact audit checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add malecns-connectome/results/annotation_io_audit.json malecns-connectome/results/annotations.sha256
          if git diff --cached --quiet; then
            echo 'No audit changes.'
          else
            git commit -m 'results: refresh MaleCNS I/O annotation audit [skip ci]'
            git push origin HEAD:malecns-connectome
          fi

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malecns-io-audit-${{ github.sha }}
          retention-days: 30
          path: |
            malecns-connectome/results/annotation_io_audit.json
            malecns-connectome/results/annotations.sha256
