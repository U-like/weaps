name: MaleCNS limb decoder experiment

on:
  workflow_dispatch:
  push:
    branches: [malecns-connectome]
    paths:
      - 'malecns-connectome/data/anchors.json'
      - 'malecns-connectome/src/malecns/limb_decoder.py'
      - 'malecns-connectome/scripts/build_anchor_features.py'
      - 'malecns-connectome/scripts/run_limb_decoder_v2.py'
      - 'malecns-connectome/scripts/extract_anchor_annotations.py'
      - 'malecns-connectome/pyproject.toml'
      - '.github/workflows/malecns-limb-experiment.yml'

concurrency:
  group: malecns-limb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: malecns-connectome
  DATA_BASE: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome
  ANNOTATIONS: body-annotations-male-cns-v1.0-minconf-0.5.feather
  WEIGHTS: connectome-weights-male-cns-v1.0-minconf-0.5.feather

jobs:
  limb-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: malecns-connectome/pyproject.toml

      - name: Install project
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'

      - name: Unit tests
        working-directory: ${{ env.PROJECT }}
        run: pytest -q

      - name: Download official Janelia annotations
        working-directory: ${{ env.PROJECT }}
        run: |
          mkdir -p data/raw results
          curl -L --fail --retry 3 --retry-delay 5 \
            "$DATA_BASE/$ANNOTATIONS" -o "data/raw/$ANNOTATIONS"
          ls -lh "data/raw/$ANNOTATIONS"

      - name: Extract official annotations for all project anchors
        working-directory: ${{ env.PROJECT }}
        run: |
          python scripts/extract_anchor_annotations.py \
            "data/raw/$ANNOTATIONS" \
            --anchors data/anchors.json \
            --output results/anchor_annotations.json

      - name: Download official MaleCNS connection graph
        working-directory: ${{ env.PROJECT }}
        run: |
          curl -L --fail --retry 3 --retry-delay 5 \
            "$DATA_BASE/$WEIGHTS" -o "data/raw/$WEIGHTS"
          ls -lh "data/raw/$WEIGHTS"
          sha256sum "data/raw/$WEIGHTS" | tee results/weights.sha256

      - name: Build direct incoming/outgoing anchor connectivity features
        working-directory: ${{ env.PROJECT }}
        run: |
          python scripts/build_anchor_features.py \
            "data/raw/$WEIGHTS" \
            --anchors data/anchors.json \
            --bins 65536 \
            --min-weight 1 \
            --output results/anchor_connectivity_features.npz

      - name: Cross-family limb decoder and permutation null
        working-directory: ${{ env.PROJECT }}
        run: |
          python scripts/run_limb_decoder_v2.py \
            results/anchor_connectivity_features.npz \
            --anchors data/anchors.json \
            --permutations 512 \
            --seed 20260912 \
            --output results/limb_decoder_v2.json

      - name: Result summary
        if: always()
        working-directory: ${{ env.PROJECT }}
        run: |
          echo '=== RESULT FILES ==='
          find results -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          echo '=== ANNOTATIONS JSON ==='
          cat results/anchor_annotations.json 2>/dev/null || true
          echo '=== LIMB DECODER JSON ==='
          cat results/limb_decoder_v2.json 2>/dev/null || true

      - name: Upload compact research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malecns-limb-decoder-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            malecns-connectome/results/anchor_annotations.json
            malecns-connectome/results/anchor_connectivity_features.npz
            malecns-connectome/results/limb_decoder_v2.json
            malecns-connectome/results/weights.sha256
